name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15.0"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test run --coverage
      - run: vp pack
